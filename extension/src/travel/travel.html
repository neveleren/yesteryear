<!doctype html>
<html lang="en" data-phase="boot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time travel</title>
  <link rel="icon" href="../ui/icons/icon32.png">
  <link rel="stylesheet" href="travel.css">
  <script type="module" src="travel.js"></script>
</head>
<body>
  <!-- Vertical motion blur for the odometer drums: one filter per drum, travel.js sets the strength. -->
  <svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
    <filter id="blur0" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="blur1" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="blur2" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="blur3" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
  </svg>

  <div class="trip" id="trip">
    <canvas class="warp" id="warp" aria-hidden="true"></canvas>
    <div class="hud" id="hud" role="img" aria-label="Time travel in progress"></div>
    <p class="skip" id="skip">Press any key or click to skip</p>
  </div>

  <div class="landing" id="landing" hidden></div>
  <div class="scan" id="scan" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>
</body>
</html>
